name: Build and Package

on:
  workflow_dispatch:
    inputs:
      package_current:
        description: Package the already committed version without another version bump.
        required: false
        type: boolean
        default: false
      manual_changelog:
        description: Optional changelog Markdown body. Leave empty to list the commits since the last tag.
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: patch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build patch release notes
        if: ${{ !inputs.package_current }}
        env:
          MANUAL_CHANGELOG: ${{ inputs.manual_changelog }}
        run: |
          mkdir -p .release
          if [ -n "$MANUAL_CHANGELOG" ]; then
            printf '%s\n' "$MANUAL_CHANGELOG" > .release/changelog-body.md
          else
            previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$previous_tag" ]; then
              base_ref="$previous_tag"
            else
              base_ref=$(git rev-list --max-parents=0 HEAD)
            fi
            git log --no-merges --pretty=format:'- %s' "$base_ref..HEAD" > .release/changelog-body.md
            if [ ! -s .release/changelog-body.md ]; then
              printf '%s\n' '- Packaged the current extension fixes for browser stores.' > .release/changelog-body.md
            fi
          fi

      - name: Bump patch version
        if: ${{ !inputs.package_current }}
        run: node scripts/bump-version.mjs

      - name: Update changelog
        if: ${{ !inputs.package_current }}
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/update-changelog.mjs \
            --version "$version" \
            --date "$(date -u +%F)" \
            --notes-file .release/changelog-body.md

      - name: Commit release metadata
        if: ${{ !inputs.package_current }}
        run: |
          version=$(node -p "require('./package.json').version")
          git add package.json package-lock.json src/chrome/manifest.json src/firefox/manifest.json src/chrome/src/ui/settings.js src/firefox/src/ui/settings.js src/chrome/ARCHITECTURE.md src/firefox/ARCHITECTURE.md CHANGELOG.md
          git commit -m "chore: release v${version}"

      # release.json is the update feed AgentX Workmate polls from the main
      # branch; it is signed with the Ed25519 key in the WEBMATE_RELEASE_SIGNING_KEY
      # secret (public half: scripts/release-signing-key.pub.pem, compiled into
      # Workmate). A missing or mismatching secret fails the release here rather
      # than shipping a feed every Workmate would ignore.
      - name: Rebuild distribution zips and the update feed
        env:
          WEBMATE_RELEASE_SIGNING_KEY: ${{ secrets.WEBMATE_RELEASE_SIGNING_KEY }}
        run: |
          rm -rf dist/*
          node scripts/build-zip.mjs
          node scripts/sign-release.mjs --in dist/release.json --out dist/release.json
          cp dist/release.json release.json
          git add -A dist release.json
          version=$(node -p "require('./package.json').version")
          git commit -m "dist: rebuild submission zips and update feed for v${version}"

      - name: Test
        run: npm test

      - name: Push release commits
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Get release metadata
        id: release_meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release_meta.outputs.VERSION }}
          target_commitish: ${{ steps.release_meta.outputs.SHA }}
          name: Release v${{ steps.release_meta.outputs.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/release.json
